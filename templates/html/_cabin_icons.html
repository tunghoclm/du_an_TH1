{% macro icon(name, size=20) -%}
{% if name == 'parking' -%}
<svg aria-hidden="true" width="{{ size }}" height="{{ size }}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="12" height="12" rx="2.5"/><path d="M6.2 11V5h2.4a1.9 1.9 0 0 1 0 3.8H6.2"/></svg>
{%- elif name == 'exit' -%}
<svg aria-hidden="true" width="{{ size }}" height="{{ size }}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M6 2.5H3.5A1.5 1.5 0 0 0 2 4v8a1.5 1.5 0 0 0 1.5 1.5H6"/><path d="M11 11l3-3-3-3"/><path d="M14 8H5.5"/></svg>
{%- elif name == 'entry' -%}
<svg aria-hidden="true" width="{{ size }}" height="{{ size }}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M10 2.5h2.5A1.5 1.5 0 0 1 14 4v8a1.5 1.5 0 0 1-1.5 1.5H10"/><path d="M7.5 11 10.5 8 7.5 5"/><path d="M2 8h8.5"/></svg>

<svg aria-hidden="true" width="{{ size }}" height="{{ size }}" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M2.5 1.5A1.5 1.5 0 0 0 1 3v10a1.5 1.5 0 0 0 1.5 1.5h4A1.5 1.5 0 0 0 8 13V3a1.5 1.5 0 0 0-1.5-1.5h-4ZM2.5 3h4v10h-4V3Zm7-1.5A1.5 1.5 0 0 0 8 3v10a1.5 1.5 0 0 0 1.5 1.5h4A1.5 1.5 0 0 0 15 13V3a1.5 1.5 0 0 0-1.5-1.5h-4ZM9.5 3h4v10h-4V3ZM4.5 5.2 3.2 6.5h2.6L4.5 5.2Zm7 5.6 1.3-1.3h-2.6l1.3 1.3Z" fill="currentColor"/></svg>

<svg class="bg-active" aria-hidden="true" fill="none" height="40" viewBox="0 0 61 40" width="61" xmlns="http://www.w3.org/2000/svg"><path d="M54.2566 38.5605L61 40H-3.8147e-06V0C11.0925 0 21.4 6.51544 27.2652 17.2344L27.575 17.8005C33.5223 28.6697 43.2013 36.2006 54.2566 38.5605Z" fill="white"/></svg>
{%- elif name == 'tab-tail-normal' -%}
<svg class="bg-normal" aria-hidden="true" fill="none" height="36" viewBox="0 0 61 36" width="61" xmlns="http://www.w3.org/2000/svg"><path d="M54.2566 34.7045L61 36H-3.8147e-06V0C11.0925 0 21.4 5.8639 27.2652 15.5109L27.575 16.0205C33.5223 25.8027 43.2013 32.5805 54.2566 34.7045Z" fill="#0F97F2"/></svg>
{%- elif name == 'vn-flag' -%}
<svg aria-hidden="true" width="{{ size }}" height="{{ size }}" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="9" fill="#DA251D"/><path d="M9 4.2L10.18 7.83H14L10.91 10.07L12.09 13.7L9 11.46L5.91 13.7L7.09 10.07L4 7.83H7.82L9 4.2Z" fill="#FFFF00"/></svg>
{%- else -%}
<svg aria-hidden="true" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
{% if name == 'car' %}<path d="m5 10 2-6h10l2 6M5 19v2m14-2v2"/><rect x="3" y="10" width="18" height="9" rx="2"/><path d="M7 14h1m8 0h1"/>

{% elif name == 'plus' %}<path d="M12 5.5v13M5.5 12h13" stroke-width="2.1"/>
{% elif name == 'close' %}<path d="m6.5 6.5 11 11M6.5 17.5l11-11" stroke-width="2.4"/>

{% elif name == 'money' %}<circle cx="12" cy="12" r="9.2" stroke-width="2"/><path d="M14.6 9.3a2 2 0 0 0-1.9-1.1h-1.6a1.9 1.9 0 0 0 0 3.8h1.8a1.9 1.9 0 0 1 0 3.8h-1.8a2 2 0 0 1-1.9-1.1M12 6.6v10.8" stroke-width="2"/>
{% elif name == 'bell' %}<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/>
{% elif name == 'bell-solid' %}<path fill="currentColor" stroke="none" d="M12 2a1.6 1.6 0 0 0-1.6 1.6v.65A6.5 6.5 0 0 0 5.5 10.5c0 4.3-1.4 5.8-2.5 6.9a.75.75 0 0 0 .53 1.28h16.94a.75.75 0 0 0 .53-1.28c-1.1-1.1-2.5-2.6-2.5-6.9a6.5 6.5 0 0 0-4.9-6.25V3.6A1.6 1.6 0 0 0 12 2Zm-2.2 17.8a2.2 2.2 0 0 0 4.4 0H9.8Z"/>
{% elif name == 'printer' %}<path fill="currentColor" stroke="none" d="M6 3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v4h1.5A2.5 2.5 0 0 1 22 9.5v6a1.5 1.5 0 0 1-1.5 1.5H18v3a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-3H3.5A1.5 1.5 0 0 1 2 15.5v-6A2.5 2.5 0 0 1 4.5 7H6V3Zm2 4h8V4H8v3Zm0 7v5h8v-5H8Zm10-3.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/>
{% elif name == 'edit' %}<path d="M16.8 3.5a2.4 2.4 0 0 1 3.4 3.4L7.8 19.3 3 20.5l1.2-4.8L16.8 3.5Z"/>
{% elif name == 'ticket-doc' %}<path d="M14 3.5H7.5A2 2 0 0 0 5.5 5.5v3.2M5.5 15.3v3.2a2 2 0 0 0 2 2H16a2 2 0 0 0 2-2v-3.2M14 3.5l4 4v1.2"/><path d="M3.5 12h2.5m3 0h2.5m3 0h2.5m3 0h1"/>
{% elif name == 'caret-down' %}<path fill="currentColor" stroke="none" d="m6.5 9.2 5.5 5.6 5.5-5.6H6.5Z"/>
{% elif name == 'wrench' %}<path d="m14 6 4 4 4-4a7 7 0 0 1-9 9l-6 6a3 3 0 0 1-4-4l6-6a7 7 0 0 1 9-9Z"/>
{% endif %}</svg>
{%- endif -%}
{%- endmacro %}
