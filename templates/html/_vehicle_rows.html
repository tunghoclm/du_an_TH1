<div class="vehicle-rows-wrap" id="vehicle-rows">
  {% set rows = form_vehicles if form_vehicles else [{}] %}
  {% for v in rows %}
    <div class="vehicle-row-item" data-vehicle-row>
      <div class="field">
        <label>BIỂN SỐ XE</label>
        <input type="text" name="plate" value="{{ v.plate or '' }}" placeholder="VD: 59A1-12345">
      </div>

      <div class="field">
        <label>LOẠI XE</label>
        <select name="vehicle_type_id">
          <option value="">-- Chọn loại xe --</option>
          {% for vt in vehicle_types %}
            <option value="{{ vt.id }}" {% if (v.type|string) == (vt.id|string) %}selected{% endif %}>{{ vt.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field">
        <label>LOẠI VÉ</label>
        <select name="ticket_type" data-ticket-select>
          {% for code, label in ticket_labels.items() %}
            <option value="{{ code }}" {% if (v.ticket or 'turn') == code %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field">
        <label>SỐ THÁNG THUÊ (1 – {{ max_months or 36 }})</label>
        <input type="number" name="months" min="1" max="{{ max_months or 36 }}" value="{{ v.months or 1 }}">
      </div>

      <div>
        <button type="button" class="btn btn-secondary" data-remove-vrow style="color:#c92a2a;height:42px;">Xóa</button>
      </div>
    </div>
  {% endfor %}
</div>

<div style="margin-top:8px;">
  <button type="button" class="btn btn-secondary" id="add-vehicle-row">+ Thêm dòng phương tiện</button>
</div>

<script>
  (function () {
    var container = document.getElementById('vehicle-rows');
    var addBtn = document.getElementById('add-vehicle-row');
    if (!container || !addBtn) return;

    function bindRow(row) {
      var rm = row.querySelector('[data-remove-vrow]');
      if (rm) {
        rm.onclick = function () {
          var all = container.querySelectorAll('[data-vehicle-row]');
          if (all.length > 1) {
            row.remove();
          } else {
            row.querySelectorAll('input[name="plate"]').forEach(function (inp) { inp.value = ''; });
          }
        };
      }
    }

    container.querySelectorAll('[data-vehicle-row]').forEach(bindRow);

    addBtn.addEventListener('click', function () {
      var first = container.querySelector('[data-vehicle-row]');
      if (!first) return;
      var clone = first.cloneNode(true);
      clone.querySelectorAll('input[name="plate"]').forEach(function (inp) { inp.value = ''; });
      container.appendChild(clone);
      bindRow(clone);
    });
  })();
</script>
