{% macro icon(name, size=18) -%}
<svg aria-hidden="true" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
{% if name == 'search' %}<circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/>
{% elif name == 'filter' %}<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="white"/><circle cx="15" cy="17" r="2" fill="white"/>
{% elif name == 'export' %}<path d="M14 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9M13 7l5 5-5 5m-6-5h14"/>
{% elif name == 'columns' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-16v16"/>
{% elif name == 'plus' %}<path d="M12 4v16M4 12h16"/>
{% elif name == 'close' %}<path d="m6 6 12 12M6 18 18 6"/>
{% elif name == 'left' %}<path d="m14 6-6 6 6 6"/>
{% elif name == 'right' %}<path d="m10 6 6 6-6 6"/>
{% elif name == 'sort' %}<path d="m8 9 4-4 4 4m-8 6 4 4 4-4"/>
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18m-11 4h3"/>
{% elif name == 'users' %}<circle cx="9" cy="7" r="4"/><path d="M2 21v-3a7 7 0 0 1 14 0v3M17 4a4 4 0 0 1 0 7m3 10v-3a7 7 0 0 0-3-6"/>
{% elif name == 'edit' %}<path d="m15 4 5 5M4 20l4-1L21 6a2 2 0 0 0-4-4L4 15ZM12 20h8"/>
{% endif %}</svg>
{%- endmacro %}
